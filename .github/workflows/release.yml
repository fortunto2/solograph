# A tag `vX.Y.Z` builds the binary for macOS (Apple silicon) and Linux (x86_64) and
# publishes a GitHub release with both, so installing needs `curl`, not Rust:
#   curl -fL -o ~/.solo/bin/solograph \
#     https://github.com/fortunto2/solograph/releases/latest/download/solograph-macos-arm64
#
# The release stays a draft until both binaries are attached. Published first, it
# was "Latest" for 3-9 minutes with no assets, and an install in that window got a
# 404 page written over the binary (review, 28 Oct 2026).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: solograph-macos-arm64
          # 22.04 for an older glibc floor: a binary built on the newest runner
          # does not start on a machine a release or two behind.
          - os: ubuntu-22.04
            asset: solograph-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --manifest-path rust/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Smoke test the binary
        run: |
          cp rust/target/release/solograph "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" --version
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish once every binary is there
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
