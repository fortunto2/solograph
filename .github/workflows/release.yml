# A tag `vX.Y.Z` builds the binary for macOS (Apple silicon) and Linux (x86_64) and
# attaches both to a GitHub release, so installing needs `curl`, not a Rust toolchain:
#   curl -L -o ~/.solo/bin/solograph \
#     https://github.com/fortunto2/solograph/releases/latest/download/solograph-macos-arm64
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: solograph-macos-arm64
          - os: ubuntu-latest
            asset: solograph-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --manifest-path rust/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Smoke test the binary
        run: |
          cp rust/target/release/solograph "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" --help | head -3
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
