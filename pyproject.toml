[project]
name = "solograph"
version = "0.8.0"
description = "MCP server for a portfolio of projects — symbol search across every repo, Claude Code session history, knowledge base and source search, all on SQLite FTS5"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Rustam Salavatov" },
]
keywords = ["mcp", "code-intelligence", "codegraph", "full-text-search", "claude-code", "solograph"]
dependencies = [
    # Transcript chunking (YouTube sources)
    "semantic-text-splitter>=0.29.0",
    # Code Analysis
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-swift>=0.0.1",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-kotlin>=1.0",
    "tree-sitter-rust>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    # Schema & Config
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    # CLI & Output
    "click>=8.1",
    "rich>=13.0.0",
    # MCP
    "mcp>=2.2.0", # 2.0.0 carries a published advisory (pip-audit, 26 Oct)
    # HTTP (web search)
    "httpx>=0.28.1",
    "httpcore>=1.0.7",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-hcl>=1.2.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-sql>=0.3.11",
    "snowballstemmer>=3.1.1",
]

[project.optional-dependencies]
scraper = ["scrapy>=2.12", "playwright>=1.49"]
dev = ["pre-commit>=4.5.1", "scrapy>=2.12", "playwright>=1.49", "certifi>=2024.0.0"]

[project.urls]
Homepage = "https://github.com/fortunto2/solograph"
Repository = "https://github.com/fortunto2/solograph"
"Solo Factory Plugin" = "https://github.com/fortunto2/solo-factory"

[project.scripts]
solograph = "codegraph_mcp.server:main"
solograph-cli = "codegraph_mcp.cli:cli"
solograph-search = "codegraph_mcp.search_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph_mcp"]

# --- Linting & Formatting ---

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress — try/except/pass is clearer for DB index creation
    "SIM108", # use ternary (readability preference)
    "SIM102", # nested if — often more readable than combined conditions
    "SIM113", # enumerate for counter — false positive when counter is a loop limiter
    "B904",   # raise from — not critical for CLI SystemExit
    "B905",   # zip without strict= (py3.10+)
    "RUF001", "RUF002", "RUF003",  # Cyrillic in strings is Russian text, not a lookalike
]

[tool.ruff.lint.isort]
known-first-party = ["codegraph_mcp"]
