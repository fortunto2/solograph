[project]
name = "solograph"
version = "0.11.0"
description = "Solograph scrapers: YouTube, ProductHunt, TrustMRR and Telegram into the sources index that the solograph Rust binary (MCP server, CLI, HTTP) reads"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Rustam Salavatov" },
]
keywords = ["mcp", "code-intelligence", "codegraph", "full-text-search", "claude-code", "solograph"]
dependencies = [
    # The scrapers and indexers that write the sources index; every read is the
    # Rust binary (rust/solograph). Transcript chunking (YouTube):
    "semantic-text-splitter>=0.29.0",
    # Schemas, channels.yaml, frontmatter for `compact`
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    # CLI & output
    "click>=8.1",
    "rich>=13.0.0",
    # YouTube discovery through SearXNG
    "httpx>=0.28.1",
    "httpcore>=1.0.7", # pin explicitly — uvx can drop transitive deps
]

[project.optional-dependencies]
scraper = ["scrapy>=2.12", "playwright>=1.49"]
dev = ["pre-commit>=4.5.1", "scrapy>=2.12", "playwright>=1.49", "certifi>=2024.0.0"]

[project.urls]
Homepage = "https://github.com/fortunto2/solograph"
Repository = "https://github.com/fortunto2/solograph"
"Solo Factory Plugin" = "https://github.com/fortunto2/solo-factory"

[project.scripts]
solograph-cli = "codegraph_mcp.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph_mcp"]

# --- Linting & Formatting ---

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress — try/except/pass is clearer for DB index creation
    "SIM108", # use ternary (readability preference)
    "SIM102", # nested if — often more readable than combined conditions
    "SIM113", # enumerate for counter — false positive when counter is a loop limiter
    "B904",   # raise from — not critical for CLI SystemExit
    "B905",   # zip without strict= (py3.10+)
    "RUF001", "RUF002", "RUF003",  # Cyrillic in strings is Russian text, not a lookalike
]

[tool.ruff.lint.isort]
known-first-party = ["codegraph_mcp"]
